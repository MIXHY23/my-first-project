<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 12px #e5b9cc;
        }

        h1 {
            color: #d63384;
        }

        button {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Hello, GitHub! 💗</h1>
        <p>Welcome to my first website.</p>
        <p>I'm learning how to code!</p>

        <button onclick="alert('You did it! 🎉')">
            Click Me
        </button>
    </div>
</body>
</html>
